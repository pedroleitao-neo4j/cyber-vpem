name: Generate Slides (Marp PDF & Pandoc PPTX)
on:
  push:
    paths:
      - 'slides.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies (Pandoc & Marp)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          npm install -g @marp-team/marp-cli

      - name: Build Editable PPTX with Pandoc
        # Pandoc uses '---' to separate slides by default
        run: |
          pandoc slides.md -t pptx -o slides.pptx

      - name: Build Styled PDF with Marp
        run: |
          marp slides.md --pdf --allow-local-files -o slides.pdf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add slides.pptx slides.pdf
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate slides (Pandoc PPTX & Marp PDF)"
          git push
