name: Generate Marp Slides (Editable)
on:
  push:
    paths:
      - 'slides.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # REQUIRED: Install LibreOffice for editable PPTX conversion
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Build Editable PPTX
        run: |
          marp slides.md --pptx --pptx-editable --allow-local-files -o slides.pptx
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Build PDF
        run: |
          marp slides.md --pdf --allow-local-files -o slides.pdf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add slides.pptx slides.pdf
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate editable slides"
          git push
